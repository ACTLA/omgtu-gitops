apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole-postgres
  labels:
    app: guacamole-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole-postgres
  template:
    metadata:
      labels:
        app: guacamole-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "guacuser"
        - name: POSTGRES_PASSWORD
          value: "guacpassword"
        - name: POSTGRES_DB
          value: "guacdb"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole-postgres
spec:
  selector:
    app: guacamole-postgres
  ports:
  - port: 5432
    targetPort: 5432