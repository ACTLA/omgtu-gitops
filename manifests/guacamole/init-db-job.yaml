apiVersion: batch/v1
kind: Job
metadata:
  name: guacamole-init-db
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
      - name: init-db
        image: guacamole/guacamole:1.5.4
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until PGPASSWORD=guacpassword /opt/guacamole/bin/initdb.sh --postgres > /dev/null 2>&1; do
            sleep 2
          done
          echo "PostgreSQL is ready. Initializing database..."
          /opt/guacamole/bin/initdb.sh --postgres | PGPASSWORD=guacpassword psql -h guacamole-postgres -U guacuser -d guacdb
          echo "Database initialized successfully!"
        env:
        - name: PGPASSWORD
          value: "guacpassword"
      restartPolicy: OnFailure